<title>Roma Pass – Guida</title>
<style>
  /* System fonts - work offline */
</style>
<style>
  :root {
    --red: #C0392B;
    --gold: #C9A227;
    --dark: #1a1a1a;
    --black: #000000;
    --gray: #6c757d;
    --light: #f8f9fa;
    --white: #ffffff;
    --border: #e9ecef;
    --warn-bg: #fff8e1;
    --warn-border: #f59e0b;
    --warn-text: #92400e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: #111;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--white);
    border-radius: 20px;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .header {
    background: #000000;
    padding: 28px 32px 20px;
    text-align: center;
    position: relative;
  }
  .header img {
    max-width: 220px;
    height: auto;
    display: block;
    margin: 0 auto 8px;
  }
  .header p {
    color: var(--gold);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .lang-bar {
    background: var(--dark);
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px;
  }
  .lang-btn {
    background: transparent;
    border: 1.5px solid rgba(201,162,39,0.4);
    color: rgba(255,255,255,0.65);
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 0.8rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .lang-btn:hover { border-color: var(--gold); color: var(--gold); }
  .lang-btn.active {
    background: #C9A227;
    border-color: #C9A227;
    color: #000000;
  }
  .body { padding: 28px 32px 32px; }
  .section { margin-bottom: 24px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #000000;
    color: #C9A227;
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 14px;
  }
  .section-header .icon { font-size: 1.2rem; }
  .section-header h2 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #C9A227 !important;
  }
  .steps { list-style: none; }
  .steps li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
    color: var(--dark);
    line-height: 1.5;
  }
  .steps li:last-child { border-bottom: none; }
  .step-num {
    background: #C9A227;
    color: #000000;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    min-width: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    margin-top: 1px;
  }
  .warnings { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .warn {
    background: var(--warn-bg);
    border-left: 3px solid var(--warn-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.83rem;
    color: var(--warn-text);
    line-height: 1.5;
  }
  .footer {
    background: #000000;
    border-top: 1px solid #333;
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .footer-problem {
    font-size: 0.85rem;
    color: #cccccc;
    line-height: 1.5;
  }
  .footer-problem strong { color: var(--gold); }
  .footer-contact {
    background: #C9A227;
    color: #000000;
    border: none;
    border-radius: 20px;
    padding: 8px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .footer-contact:hover { background: #b8911f; }
  .download-btn {
    background: transparent;
    border: 1.5px solid rgba(201,162,39,0.5);
    color: #cccccc;
    border-radius: 20px;
    padding: 6px 18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
  }
  .download-btn:hover { border-color: var(--gold); color: var(--gold); }
  @media (max-width: 500px) {
    .body { padding: 20px 18px 24px; }
    .footer { padding: 14px 18px; }
    .header { padding: 22px 18px 18px; }
  }
</style>

function renderSteps(id, steps) {
  const ul = document.getElementById(id);
  ul.innerHTML = steps.map((s, i) =>
    `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`
  ).join('');
}
function renderWarns(id, warns) {
  const div = document.getElementById(id);
  div.innerHTML = warns.map(w => `<div class="warn">${w}</div>`).join('');
}
function setLang(lang) {
  const t = translations[lang];
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('s1title').textContent = t.s1title;
  document.getElementById('s2title').textContent = t.s2title;
  document.getElementById('s3title').textContent = t.s3title;
  renderSteps('s1steps', t.s1steps);
  renderSteps('s2steps', t.s2steps);
  renderSteps('s3steps', t.s3steps);
  renderWarns('s2warns', t.s2warns);
  renderWarns('s3warns', t.s3warns);
  document.getElementById('footer-text').innerHTML = t.footerText;
  document.getElementById('footer-btn').textContent = t.footerBtn;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
}
